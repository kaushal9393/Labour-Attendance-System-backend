name: garage_attendance
description: Garage Attendance System — Kiosk & Admin modes
publish_to: none
version: 1.0.0+5

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  image: ^4.1.7
  flutter_image_compress: ^2.3.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # HTTP
  dio: ^5.4.3+1

  # Local storage
  shared_preferences: ^2.2.3

  # Camera
  camera: ^0.10.5+9

  # On-device face detection (ML Kit) — crops face before sending to server
  google_mlkit_face_detection: ^0.11.0

  # AWS Face Liveness page is opened in a Chrome Custom Tab (real Chrome
  # engine, runs in-app, full getUserMedia + WebSocket support). The result
  # is delivered back to the app via the garage:// deep link below.
  flutter_custom_tabs: ^2.1.0
  app_links: ^6.3.2

  # Firebase
  firebase_core: ^3.15.0
  firebase_messaging: ^15.2.4

  # UI helpers
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  lottie: ^3.1.0
  fl_chart: ^0.67.0
  table_calendar: ^3.1.1

  # Local notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Utils
  permission_handler: ^11.3.0
  local_auth: ^2.2.0

  # PDF report
  pdf: ^3.11.0
  printing: ^5.14.3
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
